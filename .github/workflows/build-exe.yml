name: Build EXE

on:
  push:
    branches: [ main ]
    paths-ignore: [ '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Gerar .exe
        run: npx electron-builder --win --publish never
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          name: Sistema Kumitê Lótus (Windows) ${{ github.run_number }}
          files: dist/Sistema-Kumite-Lotus.exe
